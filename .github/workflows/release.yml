name: ULTRA Release v2.0

on:
  schedule:
    - cron: "0 17 8 6 *" 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: Ultra Library v2.0.0
          body: |
            🚀 Ultra Library v2.0.0 lançada automaticamente

            - Nova versão do site publicada
            - Melhorias gerais
            - Atualização de conteúdo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Switch to v2 branch
        run: git checkout v2

      - name: Deploy to main (GitHub Pages)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "🚀 release v2"
          git push origin HEAD:main
