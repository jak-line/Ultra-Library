<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <!-- ===== META ===== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ===== TITLE & ICON ===== -->
  <title>Ultra Library</title>
  <link rel="icon" type="image/png" href="img/icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

  <!-- ===== STYLES ===== -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/ui.css">
  <link rel="stylesheet" href="css/intro.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/themes.css">

  <!-- <link rel="stylesheet" href="css/mobile.css"> -->

</head>

<body>

  <!-- ===== OVERLAYS ===== -->
  <div id="overlays">
    <div id="dim"></div>
    <div id="fade"></div>
    <div id="game-transition"></div>
  </div>

  <!-- ===== UI FIXA ===== -->
  <div id="ui">

    <div id="top-left">
      <div id="login-wrapper">
        <button id="login-btn" class="top-btn">👤</button>

        <div id="user-box">
          <div class="avatar" id="avatar-picker">
            <img id="avatar-img" src="img/default-avatar.png">

            <div class="avatar-overlay">✏️</div>
            <input type="file" id="avatar-input" accept="image/*">
          </div>

          <p class="user-title">Conta</p>
          <p id="user-name">Fulano</p>
          <button id="logout-btn">Sair</button>
        </div>
      </div>

      <button id="leaderboard-btn" class="top-btn">🏆</button>
    </div>

    <div id="top-right">
      <button id="changelog-btn" class="top-btn">📜</button>
        <div id="changelog">
          <h2>Atualizações</h2>
          <div id="changelog-content"></div>
        </div>

      <div id="theme-dropdown">
        <button id="theme-btn" class="top-btn">🎨</button>

        <div id="theme-menu">
          <button data-theme="default">Padrão</button>
          <button data-theme="dark">Dark</button>
          <button data-theme="blocks">Blocks</button>
          <button data-theme="dreamcore">Dreamcore</button>
        </div>
      </div>

      <button id="favorites-btn" class="top-btn">⭐</button>
    </div>

  </div>

  <!-- ===== INTRO ===== -->
  <div id="intro">
    <img id="ps2" src="img/ps2open.png" alt="">
    <div id="cd">
      <img src="img/cdgame.png" draggable="false">
    </div>
    <div id="intro-bg"></div>

    <button id="skip-intro">PULAR</button>
    <p id="insert-text">Insira para iniciar</p>
  </div>

  <!-- ===== APP ===== -->
  <main id="app">
    <div id="screen">

      <!-- TITLE -->
      <div id="title-container">
        <img id="title" src="img/title.png" alt="Ultra Library">
        <p id="subtitle">Emulação retrô direto no navegador</p>
      </div>

      <!-- FILTERS -->
      <div id="filters-wrapper">

        <div id="filters">

          <div id="filter-list">
            <button class="filter-btn active" data-filter="all">TODOS</button>
            <button class="filter-btn" data-filter="nes">NES</button>
            <button class="filter-btn" data-filter="snes">SNES</button>
            <button class="filter-btn" data-filter="gb">GB</button>
            <button class="filter-btn" data-filter="gbc">GBC</button>
            <button class="filter-btn" data-filter="gba">GBA</button>
            <button class="filter-btn" data-filter="n64">N64</button>
            <button class="filter-btn" data-filter="sega">GEN</button>
            <button class="filter-btn" data-filter="arcade">NEO</button>
          </div>

        </div>

        <button id="history-btn">🕘</button>

      </div>

      <!-- GAME LIBRARY -->
      <div id="library"></div>

    </div>
  </main>

    <!-- ===== GAME PLAYER ===== -->
  <div id="game">
    <div id="game-msg">
      <span class="loading-text">Carregando...</span>
      <span class="f5-text">
        Pressione F5 ou recarregue a página para voltar
      </span>
    </div>
  </div>

  <!-- ===== LOGIN ===== -->
  <div id="login-box">
    <button id="login-close">X</button>

    <h2>Login</h2>

    <input
      type="text"
      id="login-input"
      placeholder="Seu User"
    >

    <input
      type="password"
      id="login-password"
      placeholder="Senha"
    >

    <button id="login-confirm">
      Entrar
    </button>
  </div>

  <!-- ===== LEADERBOARD ===== -->
  <div id="leaderboard">

    <button id="leaderboard-close">
      X
    </button>

    <h2>🏆 Ranking Global</h2>

    <div class="leaderboard-podium"></div>

    <div class="leaderboard-list"></div>

    <div id="your-rank">
      Você não está no ranking
    </div>

  </div>

  <!-- ===== AUDIO ===== -->
  <audio id="bgm"></audio>
  <audio id="cd-insert-sfx" src="audio/cdinsert.mp3"></audio>
  <audio id="cd-read" src="audio/discread.mp3"></audio>

  <!-- ===== SCRIPTS ===== -->
  <script src="js/roms.js"></script>
  <script src="js/games.js"></script>
  <script src="js/changelog.js"></script>
  <!-- <script src="js/controls.js"></script> -->
  <script src="js/emulator.js"></script>
  <script type="module" src="js/firebase.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/music.js"></script>
  <script type="module" src="js/script.js"></script>

  <!-- <script src="js/mobile.js"></script> -->

</body>
</html>
